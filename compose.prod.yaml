services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev

        container_name: panquill-app

        ports:
            - '3000:3000'
            - '5555:5555'

        volumes:
            - .:/app
            - node_modules:/app/node_modules

        restart: 'no'

        depends_on:
            - postgres

    postgres:
        image: postgres:17
        container_name: panquill-pg


        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}

        restart: unless-stopped

        ports:
            - '5432:5432'

        volumes:
            - pgdata:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    pgdata:
    node_modules: